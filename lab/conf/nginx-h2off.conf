# CVE-2026-123007 lab — mitigation control: same vulnerable build as
# `vuln`, with HTTP/2 disabled. The known 123007/123633 paths must be
# unreachable here (CIRCL/Xint temporary mitigation, verified by probe).
worker_processes  1;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log  /dev/stdout;

    server {
        listen      8080;
        listen      443 ssl;
        http2       off;

        ssl_certificate      /etc/nginx/certs/lab.crt;
        ssl_certificate_key  /etc/nginx/certs/lab.key;

        root  /var/www;

        location = /big.bin {
        }

        location = /health {
            return 200 "ok\n";
        }
    }
}
