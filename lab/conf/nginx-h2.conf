# CVE-2026-123007 lab — vulnerable-feature configuration.
# Single worker for clean crash attribution; h2 on cleartext 8080 and TLS 443.
worker_processes  1;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log  /dev/stdout;

    server {
        listen      8080;
        listen      443 ssl;
        http2       on;

        ssl_certificate      /etc/nginx/certs/lab.crt;
        ssl_certificate_key  /etc/nginx/certs/lab.key;

        root  /var/www;

        location = /big.bin {
        }

        location = /health {
            return 200 "ok\n";
        }
    }
}
