# STRETCH (F2, ephemeral): xenial variant of nginx-h2.conf.
# Identical to nginx-h2.conf except /health: the xenial build compiles out
# the rewrite module (no PCRE2 in xenial archives), so `return` is
# unavailable — /health is a static file created by Dockerfile.xenial.
worker_processes  1;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log  /dev/stdout;

    server {
        listen      8080;
        listen      443 ssl;
        http2       on;

        ssl_certificate      /etc/nginx/certs/lab.crt;
        ssl_certificate_key  /etc/nginx/certs/lab.key;

        root  /var/www;

        location = /big.bin {
        }

        location = /health {
        }
    }
}
