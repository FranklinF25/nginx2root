# CVE-2026-121810 lab — HTTP/3 + proxy_pass + tiny worker_connections.
#
# Single worker for clean crash attribution; the QUIC listener, the TLS/h2
# TCP listener and a plain HTTP/1 listener share the same worker and thus
# the same worker_connections slot pool:
#   - 443/udp  quic reuseport + http3 on  — the CVE surface
#   - 443/tcp  ssl (http2 on)             — TLS control path
#   - 8080/tcp plain HTTP/1               — connection-slot pressure
#     (idle keepalive h1 connections are reusable-marked and hold slots)
#
# worker_connections is deliberately tiny: ngx_get_connection() calls
# ngx_drain_connections() on every allocation, and the drain acts when
# free_connection_n <= connection_n/16 — with 32/16 = 2. The value is
# substituted at container start from the WC env (entrypoint.sh), so the
# iteration matrix (32/48/64) needs no rebuild.
#
# --with-debug in the image: the quic stream lifecycle log lines
# ("quic stream ... create/close", "reusing connection") are what make
# the race interleavings observable.
worker_processes  1;
error_log  /dev/stderr debug;
pid        /tmp/nginx.pid;

events {
    worker_connections  __WC__;
}

http {
    access_log  /dev/stdout;

    upstream backend {
        server upstream:8080;
    }

    server {
        listen      8080;
        listen      443 ssl;
        listen      443 quic reuseport;
        http2       on;
        http3       on;
        quic_retry  on;

        ssl_certificate      /etc/nginx/certs/lab.crt;
        ssl_certificate_key  /etc/nginx/certs/lab.key;
        ssl_protocols        TLSv1.3;

        keepalive_timeout  75s;
        keepalive_requests 10000;

        # Static endpooints: warmup GETs (completed streams) and health.
        location = /health {
            return 200 "ok\n";
        }

        # Trigger paths (the trigger request proxied upstream —
        # ngx_event_connect_peer -> ngx_get_connection -> drain):
        location = /proxied {
            proxy_pass http://backend/ok;
        }

        # Same, but the upstream connect is instantly refused inside the
        # nginx container (nothing listens on 127.0.0.1:9).
        location = /refused {
            proxy_pass http://127.0.0.1:9/;
        }

        # Upstream that holds the request open server-side (ms via query).
        location = /slow {
            proxy_pass http://backend/slow;
        }

        # Slot-accounting observation endpoint (plain HTTP/1).
        location = /stub_status {
            stub_status;
        }
    }
}
