# CVE-2026-123634 lab — resolver/mirror use-after-free configuration.
#
# The three required ingredients (Xint §5.2, verified against 1.31.8
# source — see lab/123634/README.md):
#   1. `resolver` pointing at the attacker-controlled lab DNS service
#      (`dns`, internal compose network; ipv6=off keeps exactly one A
#      query per name so the trigger timing is unambiguous).
#   2. request-derived upstream: `proxy_pass http://$host;` — nginx
#      resolves the client-supplied Host header.
#   3. `mirror /mirror` + `mirror_request_body off` — the mirror
#      subrequest resolves the SAME $host on the SAME resolver node.
#
# Single worker so a worker death is unambiguous. error_log at notice:
# the 1.31.8 ALERT "could not cancel %V resolving" (the freed-ctx path
# marker — the safe detector) is visible at this level; 1.31.9 demoted
# that line to debug, so the fixed build stays silent.
worker_processes  1;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log  /dev/stdout;

    resolver  dns:53 valid=60s ipv6=off;
    resolver_timeout  10s;

    server {
        listen      8080;

        # health endpoint — own location, not mirrored, never proxied
        location = /health {
            return 200 "ok\n";
        }

        location / {
            mirror              /mirror;
            mirror_request_body off;
            proxy_pass          http://$host;
        }

        location = /mirror {
            internal;
            proxy_pass          http://$host;
        }
    }
}
